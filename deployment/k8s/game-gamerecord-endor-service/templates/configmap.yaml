apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-endor-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "game-gamerecord-endor-service.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "Logging": {
         "LogLevel": {
          "Default": "Warning"
          }
      },
      "GameRecordInfo": {
        "GameProviderCode": "ENDOR",        
        "LockMinute": 2
      },
      "GameRecord": {
        "GameCommandClientBaseUrl": "http://game-gamecommand/",
        "GameRoundsScheduleClientBaseUrl": "http://game-gamerounds-schedule:9090/",
        "GameInterfaceClientBaseUrl": "http://game-gameinterface-endor-service:9090/",
        "GameRecordEndorphinaSessionBaseUrl": "http://game-gamerecord-endorphina-session:9090/"
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }

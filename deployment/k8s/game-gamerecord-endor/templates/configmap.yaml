apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-endor.fullname" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Warning",
          "Grpc.Net.Client.Balancer": "Warning",
          "Grpc.Net.Client.Balancer.DnsResolver": "Debug",
          "Tgs.GameRecord.Endorphina.Messages.ManualMessageHandler": "Information",
          "Tgs.GameRecord.Endorphina.Messages.ScheduleMessageHandler": "Warning",
          "Tgs.GameRecord.Endorphina.Messages.SessionProcessMessageHandler": "Information",
          "Tgs.GameRecord.Endorphina.Messages.SessionQueuedMessageHandler": "Information",
          "Tgs.GameRecord.Endorphina.Core.ApplicationServices.GamePullRecordCommandService": "Warning"
        }
      },
      "GameRecord": {
        "GameCommandClientBaseUrl": "http://game-gamecommand/",
        "GameInterfaceClientBaseUrl": "dns:///game-gameinterface-endor-service:9090/",
        "GameRecordEndorphinaSessionBaseUrl": "http://game-gamerecord-endor-session:9090/",
        "GameRecordHandleClientBaseUrl": "http://game-gamerecord-handle/"
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]
